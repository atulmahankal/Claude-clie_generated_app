# Global networks and volumes
networks:
  jam-network:
    driver: bridge

volumes:
  base-db-data:
  auth-db-data:
  todos-db-data:
  fundflow-db-data:

# Common environment file for secrets/ports
# Place values in `.env` file

services:
  # ===== NGINX REVERSE PROXY =====
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: jam-nginx
    profiles: ["dev", "prod"]
    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - base-app-frontend
      - auth-frontend
      - todos-frontend
      - fundflow-frontend
    networks:
      - jam-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== BASE APPLICATION =====
  base-app-db:
    image: postgres:16-alpine
    container_name: jam-base-db
    profiles: ["dev", "prod", "base"]
    environment:
      POSTGRES_DB: base_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BASE_DB_PASSWORD:-postgres}
    ports:
      - "${BASE_DB_PORT:-5436}:5432"
    volumes:
      - base-db-data:/var/lib/postgresql/data
      - ./base_app/backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - jam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  base-app-backend:
    build:
      context: ./base_app/backend
      dockerfile: Dockerfile
    container_name: jam-base-backend
    profiles: ["dev", "prod", "base"]
    ports:
      - "${BASE_HTTP_PORT:-3000}:3000"
    environment:
      HTTP_PORT: 3000
      DB_HOST: base-app-db
      DB_PORT: 5432
      DB_NAME: base_app
      DB_USER: postgres
      DB_PASSWORD: ${BASE_DB_PASSWORD:-postgres}
    depends_on:
      base-app-db:
        condition: service_healthy
    networks:
      - jam-network

  base-app-frontend:
    build:
      context: ./base_app/frontend
      dockerfile: Dockerfile
    container_name: jam-base-frontend
    profiles: ["dev", "prod", "base"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BASE_BACKEND_URL: http://base-app-backend:3000
    depends_on:
      - base-app-backend
    networks:
      - jam-network

  # ===== AUTH SERVICE =====
  auth-db:
    image: postgres:16-alpine
    container_name: jam-auth-db
    profiles: ["dev", "prod", "auth"]
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./services/auth-service/backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - jam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service/backend
      dockerfile: Dockerfile
    container_name: jam-auth-service
    profiles: ["dev", "prod", "auth"]
    ports:
      - "${AUTH_HTTP_PORT:-3001}:3001"
      - "${AUTH_GRPC_PORT:-50051}:50051"
    environment:
      HTTP_PORT: 3001
      GRPC_PORT: 50051
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth
      DB_USER: postgres
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - jam-network

  auth-frontend:
    build:
      context: ./services/auth-service/frontend
      dockerfile: Dockerfile
    container_name: jam-auth-frontend
    profiles: ["dev", "prod", "auth"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_GRPC_URL: auth-service:50051
    depends_on:
      - auth-service
    networks:
      - jam-network

  # ===== TODOS SERVICE =====
  todos-db:
    image: postgres:16-alpine
    container_name: jam-todos-db
    profiles: ["dev", "prod", "todos"]
    environment:
      POSTGRES_DB: todos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TODOS_DB_PASSWORD:-postgres}
    ports:
      - "${TODOS_DB_PORT:-5435}:5432"
    volumes:
      - todos-db-data:/var/lib/postgresql/data
    networks:
      - jam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  todos-service:
    build:
      context: ./services/todos-service/backend
      dockerfile: Dockerfile
    container_name: jam-todos-service
    profiles: ["dev", "prod", "todos"]
    ports:
      - "${TODOS_HTTP_PORT:-3002}:3002"
      - "${TODOS_GRPC_PORT:-50052}:50052"
    environment:
      HTTP_PORT: 3002
      GRPC_PORT: 50052
      DB_HOST: todos-db
      DB_PORT: 5432
      DB_NAME: todos
      DB_USER: postgres
      DB_PASSWORD: ${TODOS_DB_PASSWORD:-postgres}
    depends_on:
      todos-db:
        condition: service_healthy
    networks:
      - jam-network

  todos-frontend:
    build:
      context: ./services/todos-service/frontend
      dockerfile: Dockerfile
    container_name: jam-todos-frontend
    profiles: ["dev", "prod", "todos"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TODOS_GRPC_URL: todos-service:50052
    depends_on:
      - todos-service
    networks:
      - jam-network

  # ===== FUNDFLOW SERVICE =====
  fundflow-db:
    image: postgres:16-alpine
    container_name: jam-fundflow-db
    profiles: ["dev", "prod", "fundflow"]
    environment:
      POSTGRES_DB: fundflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FUNDFLOW_DB_PASSWORD:-postgres}
    ports:
      - "${FUNDFLOW_DB_PORT:-5434}:5432"
    volumes:
      - fundflow-db-data:/var/lib/postgresql/data
    networks:
      - jam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  fundflow-service:
    build:
      context: ./services/fundflow-service/backend
      dockerfile: Dockerfile
    container_name: jam-fundflow-service
    profiles: ["dev", "prod", "fundflow"]
    ports:
      - "${FUNDFLOW_HTTP_PORT:-3003}:3003"
      - "${FUNDFLOW_GRPC_PORT:-50053}:50053"
    environment:
      HTTP_PORT: 3003
      GRPC_PORT: 50053
      DB_HOST: fundflow-db
      DB_PORT: 5432
      DB_NAME: fundflow
      DB_USER: postgres
      DB_PASSWORD: ${FUNDFLOW_DB_PASSWORD:-postgres}
    depends_on:
      fundflow-db:
        condition: service_healthy
    networks:
      - jam-network

  fundflow-frontend:
    build:
      context: ./services/fundflow-service/frontend
      dockerfile: Dockerfile
    container_name: jam-fundflow-frontend
    profiles: ["dev", "prod", "fundflow"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      FUNDFLOW_GRPC_URL: fundflow-service:50053
    depends_on:
      - fundflow-service
    networks:
      - jam-network

  # ===== EMAIL TESTING (Development Only) =====
  mailpit:
    image: axllent/mailpit:v1.10
    container_name: jam-mailpit
    profiles: ["dev", "mail"]
    ports:
      - "${MAILPIT_UI_PORT:-8030}:8025"
      - "${MAILPIT_SMTP_PORT:-1030}:1025"
    networks:
      - jam-network
