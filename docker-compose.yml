# Unified Docker Compose Configuration
# Supports development and production deployments with selective service activation
#
# Usage:
#   Development (all services):     docker compose --profile dev up
#   Production (all services):      docker compose --profile prod up
#   Specific service:               docker compose --profile auth up
#   Multiple profiles:              docker compose --profile auth --profile todos up
#
# Available Profiles:
#   - dev:       All services for development
#   - prod:      All services for production
#   - auth:      Authentication service only
#   - todos:     Todos service only
#   - fundflow:  Fundflow service only
#   - frontend:  Frontend only
#   - mail:      Mailpit email testing only

networks:
  jam-network:
    driver: bridge

volumes:
  auth-db-data:
    driver: local
  shared-db-data:
    driver: local
  fundflow-db-data:
    driver: local

services:
  # ===== DATABASES =====

  auth-db:
    image: postgres:15-alpine
    container_name: jam-auth-db
    profiles: ["dev", "prod", "auth"]
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./services/auth-service/migrations:/docker-entrypoint-initdb.d
    networks:
      - jam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  shared-db:
    image: postgres:15-alpine
    container_name: jam-shared-db
    profiles: ["dev", "prod", "todos"]
    environment:
      POSTGRES_DB: shared
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SHARED_DB_PASSWORD:-postgres}
    ports:
      - "${SHARED_DB_PORT:-5435}:5432"
    volumes:
      - shared-db-data:/var/lib/postgresql/data
      - ./services/todos-service/migrations:/docker-entrypoint-initdb.d
    networks:
      - jam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fundflow-db:
    image: postgres:15-alpine
    container_name: jam-fundflow-db
    profiles: ["dev", "prod", "fundflow"]
    environment:
      POSTGRES_DB: fundflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FUNDFLOW_DB_PASSWORD:-postgres}
    ports:
      - "${FUNDFLOW_DB_PORT:-5434}:5432"
    volumes:
      - fundflow-db-data:/var/lib/postgresql/data
      - ./services/fundflow-service/migrations:/docker-entrypoint-initdb.d
    networks:
      - jam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== MICROSERVICES =====

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: jam-auth-service
    profiles: ["dev", "prod", "auth"]
    ports:
      - "${AUTH_HTTP_PORT:-3011}:3001"
      - "${AUTH_GRPC_PORT:-50051}:50051"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_TYPE: postgres
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth
      DB_USER: postgres
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      GRPC_PORT: 50051
      HTTP_PORT: 3001
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - jam-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  todos-service:
    build:
      context: .
      dockerfile: services/todos-service/Dockerfile
    container_name: jam-todos-service
    profiles: ["dev", "prod", "todos"]
    ports:
      - "${TODOS_HTTP_PORT:-3002}:3002"
      - "${TODOS_GRPC_PORT:-50052}:50052"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_TYPE: postgres
      DB_HOST: shared-db
      DB_PORT: 5432
      DB_NAME: shared
      DB_USER: postgres
      DB_PASSWORD: ${SHARED_DB_PASSWORD:-postgres}
      GRPC_PORT: 50052
      HTTP_PORT: 3002
    depends_on:
      shared-db:
        condition: service_healthy
    networks:
      - jam-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  fundflow-service:
    build:
      context: .
      dockerfile: services/fundflow-service/Dockerfile
    container_name: jam-fundflow-service
    profiles: ["dev", "prod", "fundflow"]
    ports:
      - "${FUNDFLOW_HTTP_PORT:-3003}:3003"
      - "${FUNDFLOW_GRPC_PORT:-50053}:50053"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_TYPE: postgres
      DB_HOST: fundflow-db
      DB_PORT: 5432
      DB_NAME: fundflow
      DB_USER: postgres
      DB_PASSWORD: ${FUNDFLOW_DB_PASSWORD:-postgres}
      GRPC_PORT: 50053
      HTTP_PORT: 3003
    depends_on:
      fundflow-db:
        condition: service_healthy
    networks:
      - jam-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== FRONTEND =====

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: jam-frontend
    profiles: ["dev", "prod", "frontend"]
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      AUTH_SERVICE_URL: auth-service:50051
      TODOS_SERVICE_URL: todos-service:50052
      FUNDFLOW_SERVICE_URL: fundflow-service:50053
    depends_on:
      - auth-service
      - todos-service
      - fundflow-service
    networks:
      - jam-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== EMAIL TESTING (Development Only) =====

  mailpit:
    image: axllent/mailpit:v1.10
    container_name: jam-mailpit
    profiles: ["dev", "mail"]
    ports:
      - "${MAILPIT_UI_PORT:-8030}:8025"
      - "${MAILPIT_SMTP_PORT:-1030}:1025"
    networks:
      - jam-network
    restart: unless-stopped
