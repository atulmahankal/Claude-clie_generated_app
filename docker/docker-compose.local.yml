version: '3.9'

networks:
  jam-network:
    driver: bridge

volumes:
  auth-db-data:
  shared-db-data:
  fundflow-db-data:

services:
  # ===== DATABASES =====
  auth-db:
    image: postgres:15
    container_name: jam-auth-db
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ../services/auth-service/migrations:/docker-entrypoint-initdb.d
    networks:
      - jam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  shared-db:
    image: postgres:15
    container_name: jam-shared-db
    environment:
      POSTGRES_DB: shared
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - shared-db-data:/var/lib/postgresql/data
      - ../services/todos-service/migrations:/docker-entrypoint-initdb.d
    networks:
      - jam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  fundflow-db:
    image: postgres:15
    container_name: jam-fundflow-db
    environment:
      POSTGRES_DB: fundflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - fundflow-db-data:/var/lib/postgresql/data
      - ../services/fundflow-service/migrations:/docker-entrypoint-initdb.d
    networks:
      - jam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== MICROSERVICES =====
  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: jam-auth-service
    ports:
      - "3011:3001"
      - "50051:50051"
    environment:
      - DB_TYPE=postgres
      - DB_HOST=auth-db
      - DB_PORT=5432
      - DB_NAME=auth
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GRPC_PORT=50051
      - HTTP_PORT=3001
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - jam-network

  todos-service:
    build:
      context: ..
      dockerfile: services/todos-service/Dockerfile
    container_name: jam-todos-service
    ports:
      - "3002:3002"
      - "50052:50052"
    environment:
      - DB_TYPE=postgres
      - DB_HOST=shared-db
      - DB_PORT=5432
      - DB_NAME=shared
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GRPC_PORT=50052
      - HTTP_PORT=3002
    depends_on:
      shared-db:
        condition: service_healthy
    networks:
      - jam-network

  fundflow-service:
    build:
      context: ..
      dockerfile: services/fundflow-service/Dockerfile
    container_name: jam-fundflow-service
    ports:
      - "3003:3003"
      - "50053:50053"
    environment:
      - DB_TYPE=postgres
      - DB_HOST=fundflow-db
      - DB_PORT=5432
      - DB_NAME=fundflow
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GRPC_PORT=50053
      - HTTP_PORT=3003
    depends_on:
      fundflow-db:
        condition: service_healthy
    networks:
      - jam-network

  # ===== FRONTEND =====
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: jam-frontend
    ports:
      - "3010:3000"
    environment:
      - AUTH_SERVICE_URL=auth-service:50051
      - TODOS_SERVICE_URL=todos-service:50052
      - FUNDFLOW_SERVICE_URL=fundflow-service:50053
    depends_on:
      - auth-service
      - todos-service
      - fundflow-service
    networks:
      - jam-network

  # ===== API GATEWAY =====
  kong:
    image: kong:3.4
    container_name: jam-kong
    ports:
      - "8010:8000"
      - "8011:8001"
      - "8443:8443"
      - "8444:8444"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    networks:
      - jam-network

  # ===== EMAIL TESTING =====
  mailpit:
    image: axllent/mailpit:v1.10
    container_name: jam-mailpit
    ports:
      - "8030:8025"
      - "1030:1025"
    networks:
      - jam-network
