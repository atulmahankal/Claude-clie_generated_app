_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth-service:3001
    routes:
      - name: auth-routes
        paths:
          - /api/auth
        strip_path: true
        preserve_host: false

  - name: todos-service
    url: http://todos-service:3002
    routes:
      - name: todos-routes
        paths:
          - /api/todos
        strip_path: true
        preserve_host: false

  - name: fundflow-service
    url: http://fundflow-service:3003
    routes:
      - name: fundflow-routes
        paths:
          - /api/fundflow
        strip_path: true
        preserve_host: false

  - name: frontend-service
    url: http://frontend:3000
    routes:
      - name: frontend-routes
        paths:
          - /
        strip_path: false
        preserve_host: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600
