syntax = "proto3";

package auth;

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Signup(SignupRequest) returns (SignupResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // 2FA Operations
  rpc Enable2FA(Enable2FARequest) returns (Enable2FAResponse);
  rpc Verify2FA(Verify2FARequest) returns (Verify2FAResponse);
  rpc Disable2FA(Disable2FARequest) returns (Disable2FAResponse);

  // Session Management
  rpc GetSessions(GetSessionsRequest) returns (GetSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // Profile Management
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // Password Management
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

// Login Messages
message LoginRequest {
  string email = 1;
  string password = 2;
  string device_info = 3;
  string ip_address = 4;
}

message LoginResponse {
  bool success = 1;
  string token = 2;
  string refresh_token = 3;
  bool requires_2fa = 4;
  string error = 5;
  User user = 6;
}

// Signup Messages
message SignupRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
  string device_info = 4;
}

message SignupResponse {
  bool success = 1;
  string token = 2;
  string error = 3;
  User user = 4;
}

// Token Validation
message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string error = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  bool success = 1;
  string token = 2;
  string refresh_token = 3;
  string error = 4;
}

// Logout
message LogoutRequest {
  string session_token = 1;
}

message LogoutResponse {
  bool success = 1;
  string error = 2;
}

// 2FA Messages
message Enable2FARequest {
  string user_id = 1;
}

message Enable2FAResponse {
  bool success = 1;
  string secret = 2;
  string qr_code = 3;
  string error = 4;
}

message Verify2FARequest {
  string user_id = 1;
  string token = 2;
}

message Verify2FAResponse {
  bool success = 1;
  string error = 2;
}

message Disable2FARequest {
  string user_id = 1;
  string password = 2;
}

message Disable2FAResponse {
  bool success = 1;
  string error = 2;
}

// Session Management
message GetSessionsRequest {
  string user_id = 1;
}

message GetSessionsResponse {
  repeated Session sessions = 1;
  string error = 2;
}

message Session {
  string id = 1;
  string device_type = 2;
  string device_info = 3;
  string ip_address = 4;
  string created_at = 5;
  string last_active = 6;
  bool is_current = 7;
}

message RevokeSessionRequest {
  string user_id = 1;
  string session_id = 2;
}

message RevokeSessionResponse {
  bool success = 1;
  string error = 2;
}

// Profile Management
message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  User user = 1;
  string error = 2;
}

message UpdateProfileRequest {
  string user_id = 1;
  string display_name = 2;
  string avatar_url = 3;
}

message UpdateProfileResponse {
  bool success = 1;
  User user = 2;
  string error = 3;
}

// Password Management
message ResetPasswordRequest {
  string email = 1;
}

message ResetPasswordResponse {
  bool success = 1;
  string error = 2;
}

message ChangePasswordRequest {
  string user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {
  bool success = 1;
  string error = 2;
}

// Common User Message
message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string avatar_url = 4;
  bool two_factor_enabled = 5;
  string created_at = 6;
}
