version: '3.9'

networks:
  fundflow-network:
    driver: bridge

services:
  fundflow-db:
    image: postgres:15
    container_name: fundflow-db
    environment:
      POSTGRES_DB: fundflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - fundflow-db-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - fundflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  fundflow-service:
    build:
      context: ../..
      dockerfile: services/fundflow-service/Dockerfile
    container_name: fundflow-service
    ports:
      - "3003:3003"
      - "50053:50053"
    environment:
      - DB_TYPE=postgres
      - DB_HOST=fundflow-db
      - DB_PORT=5432
      - DB_NAME=fundflow
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GRPC_PORT=50053
      - HTTP_PORT=3003
    depends_on:
      fundflow-db:
        condition: service_healthy
    networks:
      - fundflow-network

volumes:
  fundflow-db-data:
    driver: local
