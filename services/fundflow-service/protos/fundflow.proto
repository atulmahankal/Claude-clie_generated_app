syntax = "proto3";

package fundflow;

service FundflowService {
  // Transaction Operations
  rpc CreateTransaction(CreateTransactionRequest) returns (TransactionResponse);
  rpc GetTransactions(GetTransactionsRequest) returns (TransactionsResponse);
  rpc GetTransaction(GetTransactionRequest) returns (TransactionResponse);
  rpc UpdateTransaction(UpdateTransactionRequest) returns (TransactionResponse);
  rpc DeleteTransaction(DeleteTransactionRequest) returns (DeleteResponse);

  // Category Operations
  rpc CreateCategory(CreateCategoryRequest) returns (CategoryResponse);
  rpc GetCategories(GetCategoriesRequest) returns (CategoriesResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (CategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteResponse);

  // Recurring Transaction Operations
  rpc CreateRecurringTransaction(CreateRecurringTransactionRequest) returns (RecurringTransactionResponse);
  rpc GetRecurringTransactions(GetRecurringTransactionsRequest) returns (RecurringTransactionsResponse);
  rpc GetRecurringTransaction(GetRecurringTransactionRequest) returns (RecurringTransactionResponse);
  rpc UpdateRecurringTransaction(UpdateRecurringTransactionRequest) returns (RecurringTransactionResponse);
  rpc DeleteRecurringTransaction(DeleteRecurringTransactionRequest) returns (DeleteResponse);
  rpc ProcessRecurringTransactions(ProcessRecurringTransactionsRequest) returns (ProcessRecurringTransactionsResponse);

  // Analytics Operations
  rpc GetStatistics(GetStatisticsRequest) returns (StatisticsResponse);
  rpc GetCategoryBreakdown(GetCategoryBreakdownRequest) returns (CategoryBreakdownResponse);
  rpc GetMonthlyTrends(GetMonthlyTrendsRequest) returns (MonthlyTrendsResponse);

  // Reminder Operations
  rpc GetReminders(GetRemindersRequest) returns (RemindersResponse);
  rpc DismissReminder(DismissReminderRequest) returns (ReminderResponse);
}

// Transaction Messages
message CreateTransactionRequest {
  string user_id = 1;
  string category_id = 2;
  string type = 3;  // 'income' or 'expense'
  double amount = 4;
  string currency = 5;
  string description = 6;
  string transaction_date = 7;
  string notes = 8;
}

message GetTransactionsRequest {
  string user_id = 1;
  string category_id = 2;
  string type = 3;  // 'income', 'expense', or empty for all
  string start_date = 4;
  string end_date = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message GetTransactionRequest {
  string transaction_id = 1;
  string user_id = 2;
}

message UpdateTransactionRequest {
  string transaction_id = 1;
  string user_id = 2;
  string category_id = 3;
  string type = 4;
  double amount = 5;
  string currency = 6;
  string description = 7;
  string transaction_date = 8;
  string notes = 9;
}

message DeleteTransactionRequest {
  string transaction_id = 1;
  string user_id = 2;
}

message TransactionResponse {
  bool success = 1;
  Transaction transaction = 2;
  string error = 3;
}

message TransactionsResponse {
  repeated Transaction transactions = 1;
  int32 total_count = 2;
  string error = 3;
}

message Transaction {
  string id = 1;
  string user_id = 2;
  string category_id = 3;
  string type = 4;
  double amount = 5;
  string currency = 6;
  string description = 7;
  string transaction_date = 8;
  string notes = 9;
  string created_at = 10;
  string updated_at = 11;
  Category category = 12;
}

// Category Messages
message CreateCategoryRequest {
  string user_id = 1;
  string name = 2;
  string type = 3;  // 'income' or 'expense'
  string color = 4;
  string icon = 5;
}

message GetCategoriesRequest {
  string user_id = 1;
  string type = 2;  // 'income', 'expense', or empty for all
}

message UpdateCategoryRequest {
  string category_id = 1;
  string user_id = 2;
  string name = 3;
  string color = 4;
  string icon = 5;
}

message DeleteCategoryRequest {
  string category_id = 1;
  string user_id = 2;
}

message CategoryResponse {
  bool success = 1;
  Category category = 2;
  string error = 3;
}

message CategoriesResponse {
  repeated Category categories = 1;
  string error = 2;
}

message Category {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string type = 4;
  string color = 5;
  string icon = 6;
  string created_at = 7;
  string updated_at = 8;
}

// Recurring Transaction Messages
message CreateRecurringTransactionRequest {
  string user_id = 1;
  string category_id = 2;
  string type = 3;  // 'income' or 'expense'
  double amount = 4;
  string currency = 5;
  string description = 6;
  string frequency = 7;  // 'daily', 'weekly', 'monthly', 'yearly'
  string start_date = 8;
  string end_date = 9;  // optional
  int32 day_of_month = 10;  // for monthly
  int32 day_of_week = 11;  // for weekly (0=Sunday, 6=Saturday)
  bool auto_create = 12;
  int32 reminder_days_before = 13;
}

message GetRecurringTransactionsRequest {
  string user_id = 1;
  string type = 2;  // 'income', 'expense', or empty for all
  bool active_only = 3;
}

message GetRecurringTransactionRequest {
  string recurring_id = 1;
  string user_id = 2;
}

message UpdateRecurringTransactionRequest {
  string recurring_id = 1;
  string user_id = 2;
  string category_id = 3;
  string type = 4;
  double amount = 5;
  string currency = 6;
  string description = 7;
  string frequency = 8;
  string start_date = 9;
  string end_date = 10;
  int32 day_of_month = 11;
  int32 day_of_week = 12;
  bool auto_create = 13;
  int32 reminder_days_before = 14;
  bool is_active = 15;
}

message DeleteRecurringTransactionRequest {
  string recurring_id = 1;
  string user_id = 2;
}

message ProcessRecurringTransactionsRequest {
  string user_id = 1;  // optional, process for specific user or all users
}

message ProcessRecurringTransactionsResponse {
  bool success = 1;
  int32 processed_count = 2;
  int32 created_count = 3;
  int32 reminder_count = 4;
  string error = 5;
}

message RecurringTransactionResponse {
  bool success = 1;
  RecurringTransaction recurring_transaction = 2;
  string error = 3;
}

message RecurringTransactionsResponse {
  repeated RecurringTransaction recurring_transactions = 1;
  string error = 2;
}

message RecurringTransaction {
  string id = 1;
  string user_id = 2;
  string category_id = 3;
  string type = 4;
  double amount = 5;
  string currency = 6;
  string description = 7;
  string frequency = 8;
  string start_date = 9;
  string end_date = 10;
  string last_processed_date = 11;
  string next_occurrence_date = 12;
  int32 day_of_month = 13;
  int32 day_of_week = 14;
  bool auto_create = 15;
  int32 reminder_days_before = 16;
  bool is_active = 17;
  string created_at = 18;
  string updated_at = 19;
  Category category = 20;
}

// Analytics Messages
message GetStatisticsRequest {
  string user_id = 1;
  string start_date = 2;
  string end_date = 3;
  string currency = 4;
}

message StatisticsResponse {
  bool success = 1;
  Statistics statistics = 2;
  string error = 3;
}

message Statistics {
  double total_income = 1;
  double total_expenses = 2;
  double net_balance = 3;
  string currency = 4;
  int32 transaction_count = 5;
  double average_transaction = 6;
  string period_start = 7;
  string period_end = 8;
}

message GetCategoryBreakdownRequest {
  string user_id = 1;
  string type = 2;  // 'income' or 'expense'
  string start_date = 3;
  string end_date = 4;
  string currency = 5;
}

message CategoryBreakdownResponse {
  bool success = 1;
  repeated CategoryBreakdownItem breakdown = 2;
  double total_amount = 3;
  string error = 4;
}

message CategoryBreakdownItem {
  string category_id = 1;
  string category_name = 2;
  double amount = 3;
  double percentage = 4;
  int32 transaction_count = 5;
}

message GetMonthlyTrendsRequest {
  string user_id = 1;
  string start_date = 2;  // YYYY-MM format
  string end_date = 3;    // YYYY-MM format
  string currency = 4;
}

message MonthlyTrendsResponse {
  bool success = 1;
  repeated MonthlyTrendItem trends = 2;
  string error = 3;
}

message MonthlyTrendItem {
  string month = 1;  // YYYY-MM format
  double income = 2;
  double expenses = 3;
  double net_balance = 4;
  int32 transaction_count = 5;
}

// Reminder Messages
message GetRemindersRequest {
  string user_id = 1;
  bool unread_only = 2;
}

message RemindersResponse {
  repeated Reminder reminders = 1;
  string error = 2;
}

message DismissReminderRequest {
  string reminder_id = 1;
  string user_id = 2;
}

message ReminderResponse {
  bool success = 1;
  Reminder reminder = 2;
  string error = 3;
}

message Reminder {
  string id = 1;
  string user_id = 2;
  string recurring_transaction_id = 3;
  string reminder_date = 4;
  string message = 5;
  bool is_read = 6;
  string created_at = 7;
  RecurringTransaction recurring_transaction = 8;
}

// Common Response
message DeleteResponse {
  bool success = 1;
  string error = 2;
}
