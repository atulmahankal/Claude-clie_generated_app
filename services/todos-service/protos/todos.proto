syntax = "proto3";

package todos;

service TodosService {
  // List Operations
  rpc CreateList(CreateListRequest) returns (ListResponse);
  rpc GetLists(GetListsRequest) returns (ListsResponse);
  rpc GetList(GetListRequest) returns (ListResponse);
  rpc UpdateList(UpdateListRequest) returns (ListResponse);
  rpc DeleteList(DeleteListRequest) returns (DeleteResponse);

  // Todo Operations
  rpc CreateTodo(CreateTodoRequest) returns (TodoResponse);
  rpc GetTodos(GetTodosRequest) returns (TodosResponse);
  rpc GetTodo(GetTodoRequest) returns (TodoResponse);
  rpc UpdateTodo(UpdateTodoRequest) returns (TodoResponse);
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteResponse);
  rpc ToggleTodo(ToggleTodoRequest) returns (TodoResponse);
}

// List Messages
message CreateListRequest {
  string user_id = 1;
  string name = 2;
  string color = 3;
  string icon = 4;
}

message GetListsRequest {
  string user_id = 1;
}

message GetListRequest {
  string list_id = 1;
  string user_id = 2;
}

message UpdateListRequest {
  string list_id = 1;
  string user_id = 2;
  string name = 3;
  string color = 4;
  string icon = 5;
  int32 sort_order = 6;
}

message DeleteListRequest {
  string list_id = 1;
  string user_id = 2;
}

message ListResponse {
  bool success = 1;
  TodoList list = 2;
  string error = 3;
}

message ListsResponse {
  repeated TodoList lists = 1;
  string error = 2;
}

message TodoList {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string color = 4;
  string icon = 5;
  int32 sort_order = 6;
  string created_at = 7;
  string updated_at = 8;
  int32 todo_count = 9;
  int32 completed_count = 10;
}

// Todo Messages
message CreateTodoRequest {
  string list_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  string priority = 5;
  string due_date = 6;
}

message GetTodosRequest {
  string list_id = 1;
  string user_id = 2;
  bool completed_only = 3;
  bool active_only = 4;
}

message GetTodoRequest {
  string todo_id = 1;
  string user_id = 2;
}

message UpdateTodoRequest {
  string todo_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  string priority = 5;
  string due_date = 6;
}

message DeleteTodoRequest {
  string todo_id = 1;
  string user_id = 2;
}

message ToggleTodoRequest {
  string todo_id = 1;
  string user_id = 2;
}

message TodoResponse {
  bool success = 1;
  Todo todo = 2;
  string error = 3;
}

message TodosResponse {
  repeated Todo todos = 1;
  string error = 2;
}

message Todo {
  string id = 1;
  string list_id = 2;
  string user_id = 3;
  string title = 4;
  string description = 5;
  bool completed = 6;
  string priority = 7;
  string due_date = 8;
  string completed_at = 9;
  string created_at = 10;
  string updated_at = 11;
}

// Common Response
message DeleteResponse {
  bool success = 1;
  string error = 2;
}
